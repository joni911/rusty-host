[workspace]
resolver = "2"
members = ["crates/rh-core", "crates/rh-cli", "crates/rh-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["joni911"]
repository = "https://github.com/joni911/rusty-host"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
# minimal zip: read-only needs. zopfli (a C-backed dep) is explicitly off so the
# build stays free of any C toolchain requirement.

# zip 0.6: stable, loads deflate via flate2, no C-backed dependencies.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
